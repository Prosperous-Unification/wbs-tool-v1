pre-commit:
  parallel: true
  commands:
    lint:
      run: bunx eslint {staged_files}
      glob: '*.{ts,tsx,js,mjs,cjs}'
    format:
      run: bunx prettier --check {staged_files}
      glob: '*.{ts,tsx,js,json,md,yml,yaml,css}'
      # Symlinks to AGENTS.md. Prettier exits 2 on an explicitly-named symlink
      # rather than following it, and staged_files names them explicitly, so
      # .prettierignore does not apply. Same reason they are in .nxignore.
      exclude:
        - CLAUDE.md
        - GEMINI.md
    plaintext-secrets:
      run: bun run tools/tool-git-hooks/src/hooks/plaintext-secrets.ts {staged_files}
    migration-lint:
      run: bun run tools/tool-git-hooks/src/hooks/migration-lint.ts {staged_files}
      glob: 'apps/be-01/drizzle/**/*.sql'

    doc-caps:
      run: bun run tools/tool-git-hooks/src/hooks/doc-caps.ts
      glob: 'LLM_README.md'

# Stamp agent-authored commits without replacing lefthook's generated wrapper.
# Both stages are required: normal git commits invoke prepare-commit-msg, while
# commit-tree based automation invokes only commit-msg.
prepare-commit-msg:
  commands:
    agent-authored-by:
      run: ops/agent-trailer/prepare-commit-msg {1} {2}

commit-msg:
  commands:
    agent-authored-by:
      run: ops/agent-trailer/prepare-commit-msg {1}

# Conventional-commits enforcement remains disabled per developer preference.
# Add it beside agent-authored-by above before re-running
# `nx run tool-git-hooks:install` if that preference changes.
