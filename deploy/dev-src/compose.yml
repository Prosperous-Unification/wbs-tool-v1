# Dev runs from source, so one container serves all three tiers rather than a
# blue/green pair per tier. Prod's topology is untouched and is not described
# here.
services:
  dev-src:
    image: wbs-dev-src:1
    container_name: wbs-dev-src
    working_dir: /src
    # Run as puni1 (1000:1000), the owner of the bind mount. As root the
    # container wrote root-owned .nx/ and dist/ into the checkout, which puni1
    # then could not delete or overwrite -- and the deploy is `git reset --hard`
    # run as puni1, so that becomes a deploy that fails on its own build output.
    user: '1000:1000'
    # The deploy is a write into this mount. `bun --watch` (be, gw) and Vite
    # HMR (fe) pick it up, so an ordinary code change restarts nothing.
    volumes:
      - /home/puni1/wbs-dev/src:/src
      - /home/puni1/wbs-dev/data:/data
    env_file:
      # Provider credentials stay off-repo and are mode 600 on the dev host.
      # CI has no credential file; on dev its absence is still fatal because
      # AUTH_MODE=oidc makes every server validate the required values at boot.
      - path: /home/puni1/wbs-dev/oidc-dev.env
        required: false
    # This is the only env_file. It carries shared provider settings only.
    # Adding the per-tier be-01.env or gw-01.env here would merge both PORT
    # values into one process namespace and make the tiers collide.
    #
    # Each tier's serve target runs with cwd apps/<tier>, and Bun loads .env
    # from the working directory, so per-app .env files give each process its
    # own namespace. They are gitignored, so a `git reset --hard` deploy leaves
    # them intact. Seeded on h2puni from /home/puni1/wbs-dev/*.env; the tier
    # URLs point at localhost rather than the *.internal aliases, which still
    # resolve to the old per-tier containers.
    # Must stay on wbs-dev-net: `be-01.internal` is a network-global Docker
    # alias, so a container on the prod network resolves prod's backend.
    environment:
      # The Nx daemon keeps task state under .nx/ inside the bind mount, so it
      # outlives the container. After a recreate the new process found the dead
      # one's locks and sat at "Waiting for gw-01:serve in another nx process"
      # with only be-01 running -- a half-up dev environment whose logs looked
      # like a slow start rather than a deadlock.
      NODE_ENV: 'development'
      AUTH_MODE: 'oidc'
      NX_DAEMON: 'false'
    # Dev shares a host with prod, so it gets hard ceilings. Measured
    # 2026-08-04: 278 MiB and 60 PIDs steady-state, on a 7.5 GiB host where
    # dagger-engine alone holds 2.6 GiB. These are ~5x headroom, sized to stop a
    # Vite rebuild loop or a fork storm from reaching prod, not to be generous.
    # Without them the blast radius of a dev bug is the production site.
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    # An unbounded json-file log on a shared host is a disk-exhaustion path that
    # takes prod down with it.
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
    networks:
      - wbs-dev-net
    restart: unless-stopped
    command: ['bun', 'run', 'dev']

networks:
  wbs-dev-net:
    external: true
