# The gate. Before this existed, lefthook pre-commit was the only mechanical
# check in the repo and `--no-verify` bypassed all of it, so every rule in
# AGENTS.md was advisory. This is what makes them binding.
#
# Every step here is proven to fail on a real fault, not assumed to:
#   secrets-scan   Proof: `plaintext-secrets.ts` on a file containing a literal
#                  AWS access key id exits 1 naming that pattern. (The example
#                  key is not reproduced here — the scanner reads this file and
#                  would flag it, which is itself the proof.)
#   migration-lint Proof: `migration-lint.ts` on a file containing
#                  `DROP TABLE users;` exits 1 with "destructive statement".
# Both were run against the real scripts before this file was committed. See
# AGENTS.md, "Non-vacuous checks".
#
# Deliberately run-many, not affected: at ~10k LOC the whole suite is cheap, and
# `nx affected` needs a base ref that is wrong or missing often enough to make
# the gate silently narrow. A gate that skips work it should have run is the
# exact failure this repo keeps hitting.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: with the default depth of 1 the `main` ref is absent, and
      # nx falls back to a different file scope rather than failing. Depth 0
      # also keeps `nx affected` usable if this ever moves off run-many.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `nx run-many -t build` shellchecks the deploy scripts and is no longer
      # allowed to skip itself when shellcheck is absent. ubuntu-latest ships
      # it, but assert rather than discovering the absence as a green build
      # that checked nothing.
      - name: Assert shellcheck present
        run: shellcheck --version

      - name: Install
        run: bun install --frozen-lockfile

      # --all, not the default base..HEAD comparison. Without it the scope is
      # whatever `git diff main HEAD` returns, which is EMPTY on a push to main
      # — a format gate that checks nothing and passes. When the base ref is
      # missing entirely, nx silently widens to all files instead of failing.
      # Both are scope that moves without saying so. --all does not move.
      - name: Format
        run: bunx nx format:check --all

      # --parallel=2 is pinned, not tuned. `gw-01:test` runs `bun test --coverage`
      # and began dying part-way through writing its coverage table on the branch
      # that added a 20th project — every test in it passing, no assertion
      # failing, just a non-zero exit. It reproduced in roughly two runs out of
      # three there and never once in twelve local runs, while main stayed green
      # across four. That profile is resource contention on the runner, not a
      # defect in gw-01.
      #
      # The reason to pin rather than retry: a gate whose verdict depends on how
      # many unrelated tasks happen to be co-running is not reporting on the code.
      # Left alone it would have become the gate people re-run until it is green,
      # which is a check that cannot fail wearing a different hat.
      - name: Gate — test, lint, typecheck, build
        run: bunx nx run-many -t test lint typecheck build --parallel=2

      # The two lefthook hooks, re-run here over every tracked file rather than
      # only the staged ones. A `--no-verify` commit reaches this.
      - name: Secrets scan
        run: |
          set -euo pipefail
          files="$(git ls-files)"
          test -n "$files" || { echo "no tracked files — scan would be vacuous"; exit 1; }
          # shellcheck disable=SC2086
          bun run tools/tool-git-hooks/src/hooks/plaintext-secrets.ts $files

      - name: Migration lint
        run: |
          set -euo pipefail
          files="$(git ls-files '*.sql')"
          if [ -z "$files" ]; then
            echo "no .sql files tracked — nothing to lint"
            exit 0
          fi
          # shellcheck disable=SC2086
          bun run tools/tool-git-hooks/src/hooks/migration-lint.ts $files

      # The scope and version are both explicit on purpose. `bunx openspec`
      # resolves an unrelated package on npm that has no bin, so the step died
      # with "could not determine executable" rather than validating anything;
      # it only worked locally because volta has the real CLI on PATH. Pinning
      # the version stops a CLI release from changing what this gate means.
      #
      # Proof: with a change's scenarios written `###` instead of `####`,
      # this exits 1 with failed: 1. Restored, it exits 0 with passed: 2.
      - name: OpenSpec
        run: bunx @fission-ai/openspec@1.3.0 validate --all --json
