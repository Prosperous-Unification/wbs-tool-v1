# The lock (tasks.md 5.1). Hash-verified, fully pinned, transitive closure
# included. Install with:
#
#     python3 -m pip install --require-hashes -r libs/solver-py/requirements.lock
#
# HOW IT WAS MADE, so the next person can reproduce it rather than guess:
#
#     python3 -m pip install --dry-run --ignore-installed --report report.json \
#         "ortools==9.15.6755" "jsonschema==4.26.0"
#
# on CPython 3.14.4 / linux x86_64, then each entry of `report.json`'s `install`
# array rendered as its resolved distribution and that distribution's own
# sha256. So these are the artifacts pip actually chose, not a re-derivation of
# what it might choose.
#
# WHAT THIS LOCK DOES NOT COVER, stated rather than discovered:
#
#  - **One platform.** The wheel filenames in the comments are cp314 /
#    manylinux x86_64 for ortools, numpy, pandas and rpds-py, so this file
#    installs on Linux x86_64 under CPython 3.14 and nowhere else. That is the
#    pinned runtime (pyproject.toml `requires-python`), it is what h2puni and
#    the CI runner are, and the Python suite is CI-only (5.3) so no developer
#    machine has to satisfy it. A second target platform needs its own lock
#    file beside this one — NOT a widened hash list here, which would let a
#    resolver silently pick a different build.
#  - **The build of `wbs-solver` itself.** `--require-hashes` covers these
#    runtime dependencies. Installing this package pulls setuptools into an
#    isolated build environment unhashed; the image path (5.11) is where that is
#    pinned, and the suite never installs the distribution at all — it imports
#    from `src/` and shells `python -m wbs_solver`.
#  - **Anything test-only.** The suite is stdlib `unittest`, on purpose: a
#    pytest dependency would need its own lock entry and its own CI install for
#    no coverage this file cannot already reach.
#
# Two hazards, both real, neither hypothetical:
#  - protobuf is `cp39-abi3`, so its pin is a stable-ABI wheel shared across
#    interpreter versions. It is still exact.
#  - ortools declares `protobuf<6.34,>=6.33.1`. A protobuf bump inside that
#    range is a resolver decision, which is exactly why it is pinned here and
#    not left to one.

--require-hashes

