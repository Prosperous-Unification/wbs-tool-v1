# The macOS arm64 development lock, beside `requirements.lock` rather than
# inside it. Install with:
#
#     python3.14 -m pip install --require-hashes -r libs/solver-py/requirements.macos-arm64.lock
#
# WHY A SECOND FILE. `requirements.lock` says it in its own words: "A second
# target platform needs its own lock file beside this one — NOT a widened hash
# list here, which would let a resolver silently pick a different build." This
# is that file. Production still installs only the Linux lock; nothing here
# reaches the image.
#
# HOW IT WAS MADE, by the same recipe as the Linux lock plus one constraint:
#
#     grep -oE '^[a-zA-Z0-9._-]+==[^ \]+' libs/solver-py/requirements.lock > constraints.txt
#     python3.14 -m pip install --dry-run --ignore-installed --only-binary=:all: \
#         -c constraints.txt --report report.json \
#         "ortools==9.15.6755" "jsonschema==4.26.0"
#
# `--only-binary=:all:` does not change today's selection -- verified, the resolved
# set is identical with and without it -- and is in the recipe so a future sdist
# cannot be chosen silently and then built against whatever toolchain the machine
# happens to have.
#
# on CPython 3.14 / macOS arm64, then each entry of `report.json`'s `install`
# array rendered as its resolved distribution and that distribution's own
# sha256.
#
# **The constraints file is the point, not a convenience.** Resolving free on
# this platform picked numpy 2.5.3 where the Linux lock pins 2.5.2 — a silent
# split in the runtime closure between the two platforms. Constraining to the
# Linux lock's pins makes the version map identical BY CONSTRUCTION, so the only
# thing that differs between the platforms is which wheel carries each version.
# Regenerate this file the same way whenever the Linux lock moves; a drift check
# that compares the two version maps is what keeps that honest.
#
# WHAT DIFFERS FROM THE LINUX LOCK: five artifacts, same five versions —
# numpy, ortools, pandas and rpds-py as cp314 macosx arm64 wheels, and protobuf
# as the universal2 stable-ABI wheel. The other nine are `py3-none-any` and are
# byte-identical to the Linux lock's.
#
# WHAT THIS LOCK DOES NOT COVER:
#
#  - **The build of `wbs-solver` itself**, exactly as the Linux lock notes.
#  - **Anything the dev profile cannot enforce.** Installing this gives a
#    working CP-SAT on macOS; it does not give the cgroup memory ceiling, the
#    parent-death signal, or the systemd deadline authority that the supervised
#    Linux path has. Those absences belong in the profile's capability status,
#    not in a lock file.

--require-hashes

